<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 175 40" width="175" height="40" role="img" aria-label="Apex Comfort Systems">
  <title>Apex Comfort Systems</title>
  <g transform="scale(0.4651)">
    <g fill="none" stroke-linecap="butt" stroke-linejoin="miter">
      <g stroke="#AD5622" stroke-width="9">
        <path d="M40 44 L3 56"/>
        <path d="M34 59 L6 68"/>
        <path d="M28 73 L11 79"/>
      </g>
      <g stroke="currentColor" stroke-width="11">
        <path d="M16 80 L56 8 L96 80"/>
        <path d="M35 80 L56 41 L77 80"/>
      </g>
    </g>
  </g>
  <!-- Wordmark. textLength locks the metrics so the lockup keeps its
       proportions even where the Geist webfont is unavailable, which is the
       case for standalone file use: og-default.jpg, the structured-data logo
       property, and the IMG-09 van composite. Inline in the header and
       footer, Geist resolves normally. -->
  <text x="56.5" y="24.5" font-family="Geist, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif"
        font-size="28" font-weight="800" letter-spacing="-0.02em"
        textLength="118" lengthAdjust="spacingAndGlyphs"
        fill="currentColor">APEX</text>
  <!-- Section 5.2.1 copper-in-logo exception: the subtitle is set in copper as
       brand identity, not as an affordance. This is the only permitted
       non-actionable use of copper anywhere in the system. -->
  <text x="56.5" y="35.5" font-family="Geist, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif"
        font-size="7.4" font-weight="700" letter-spacing="0.16em"
        textLength="118" lengthAdjust="spacing"
        fill="#AD5622">COMFORT SYSTEMS</text>
</svg>
